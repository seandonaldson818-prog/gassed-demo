<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gassed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0a0612; --bg-glow:#1c0f33; --card:#150c24; --violet:#8b2fff; --violet-rgb:139,47,255; --violet-bright:#b565ff; --pink:#ff4fd8; --pink-rgb:255,79,216;
    --text:#f4eefe; --muted:#a89bc4; --display-font:'Bebas Neue', -apple-system, sans-serif;
  }
  /* Event page themes — event.theme picks one of these via a data-theme attribute
     on <html>, set in loadEvent()/applyTheme() below. Default (no attribute, or an
     unrecognized value) is the violet palette defined in :root above. --violet-rgb
     is the same color as --violet, in "r,g,b" form so rgba() tints (like .host-row's
     background/border) can follow the theme too instead of staying hardcoded violet. */
  html[data-theme="amber"]{
    --bg:#170f0a; --bg-glow:#2c1c0c; --card:#231a0f; --violet:#b8823a; --violet-rgb:184,130,58; --violet-bright:#f5c86b; --pink:#ff9eb0; --pink-rgb:255,158,176;
    --text:#fff8ef; --muted:#cdb69a;
  }
  html[data-theme="neon"]{
    --bg:#04120f; --bg-glow:#062824; --card:#0d211c; --violet:#00b894; --violet-rgb:0,184,148; --violet-bright:#39ffc7; --pink:#7cf9ff; --pink-rgb:124,249,255;
    --text:#eafff8; --muted:#7fd9c4;
  }
  html[data-theme="redroom"]{
    --bg:#150505; --bg-glow:#2c0a0a; --card:#241010; --violet:#c81e3a; --violet-rgb:200,30,58; --violet-bright:#ff3355; --pink:#ff6b6b; --pink-rgb:255,107,107;
    --text:#fff0f0; --muted:#c99797;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(circle at 50% 0%, var(--bg-glow) 0%, var(--bg) 55%);
    color:var(--text); min-height:100vh; display:flex; justify-content:center;
  }
  .phone{ width:100%; max-width:430px; min-height:100vh; padding-bottom:60px; }
  .hero{ padding:48px 20px 28px; text-align:center; position:relative; }
  .brand{ font-size:12px; letter-spacing:3px; color:var(--muted); text-transform:uppercase; margin-bottom:16px; }
  .brand span{ color:var(--violet-bright); font-weight:700; }
  .club-name{ font-family:var(--display-font); font-size:40px; font-weight:400; letter-spacing:1px; background:linear-gradient(90deg,var(--violet-bright),var(--pink)); -webkit-background-clip:text; background-clip:text; color:transparent; margin:0 0 8px; line-height:1.05; }
  .meta{ font-size:14px; color:var(--muted); line-height:1.7; }
  .host-row{ margin-top:16px; display:inline-flex; align-items:center; gap:8px; background:rgba(var(--violet-rgb),0.12); border:1px solid rgba(var(--violet-rgb),0.35); padding:6px 14px; border-radius:999px; font-size:13px; }
  .host-dot{ width:8px;height:8px;border-radius:50%; background:var(--violet-bright); box-shadow:0 0 10px var(--violet-bright); }

  .section{ margin:24px 20px 0; }
  .section-label{ font-family:var(--display-font); font-size:16px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }
  .entry-card{ background:var(--card); border:1px solid rgba(255,255,255,0.06); border-radius:14px; padding:14px 16px; font-size:14px; box-shadow:0 8px 24px rgba(0,0,0,0.18); }
  .entry-card b{ color:var(--violet-bright); }
  .hype-banner{ margin-top:10px; padding:12px 14px; border-radius:14px; background:linear-gradient(120deg, rgba(var(--violet-rgb),0.16), rgba(var(--pink-rgb),0.12)); border:1px solid rgba(var(--pink-rgb),0.35); font-size:13.5px; font-weight:600; }

  /* Host identity — the plug's name/branding/photo shown to guests */
  .host-spot-card{
    position:relative; background:var(--card); border:1px solid rgba(255,255,255,0.08);
    border-radius:16px; padding:16px; overflow:hidden; box-shadow:0 8px 24px rgba(0,0,0,0.2);
  }
  .host-spot-card::before{
    content:""; position:absolute; top:-40px; left:-30px; width:150px; height:150px; border-radius:50%;
    background:radial-gradient(circle, rgba(var(--violet-rgb),0.28), transparent 70%); filter:blur(2px); pointer-events:none;
  }
  .host-spot-top{ position:relative; z-index:1; display:flex; align-items:center; gap:13px; }
  .host-spot-avatar{
    position:relative; flex-shrink:0; width:56px; height:56px; border-radius:50%;
    background:linear-gradient(135deg, var(--violet-bright), var(--pink));
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 18px rgba(var(--pink-rgb),0.4); border:2px solid rgba(255,255,255,0.2);
    font-family:var(--display-font); font-size:22px; color:#fff; overflow:hidden;
  }
  .host-spot-avatar img{ width:100%; height:100%; object-fit:cover; border-radius:50%; }
  .host-spot-info{ min-width:0; }
  .host-spot-label{ font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); font-weight:800; margin-bottom:2px; }
  .host-spot-name{ font-family:var(--display-font); font-size:22px; letter-spacing:.4px; color:var(--text); margin-bottom:3px; }
  .host-spot-tagline{ font-size:12.5px; color:var(--text); opacity:.85; line-height:1.4; font-style:italic; }

  .gauge-wrap{ background:var(--card); border:1px solid rgba(255,255,255,0.06); border-radius:14px; padding:14px 16px; }
  .gauge-top{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:10px; color:var(--muted); }
  .gauge-top b{ color:var(--text); }
  .tank-wrap{ position:relative; height:40px; border-radius:10px; background:linear-gradient(180deg,#180f2a,#0c0716); border:1px solid rgba(255,255,255,0.09); overflow:hidden; }
  .tank-fill{ position:absolute; left:0; top:0; bottom:0; width:0%; background:linear-gradient(90deg, var(--violet), var(--pink)); transition:width 1.4s cubic-bezier(.2,.8,.2,1); }

  .lineup-item{ background:var(--card); border:1px solid rgba(255,255,255,0.08); border-radius:12px; padding:14px; margin-bottom:10px; }
  .li-top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  .li-name{ font-weight:700; font-size:15px; }
  .li-price{ font-weight:800; color:var(--violet-bright); font-size:16px; }
  .li-desc{ font-size:13px; color:var(--muted); line-height:1.5; }

  .form-card{ background:var(--card); border:1px solid rgba(255,255,255,0.06); border-radius:14px; padding:18px 16px; }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:12px; color:var(--muted); margin-bottom:6px; }
  .field input{ width:100%; padding:12px 14px; border-radius:10px; border:1px solid rgba(255,255,255,0.12); background:#0f0919; color:var(--text); font-size:15px; }
  .field input:focus{ outline:none; border-color:var(--violet-bright); }
  .submit-btn{ width:100%; padding:14px; border:none; border-radius:12px; font-size:15px; font-weight:800; color:#fff; background:linear-gradient(90deg,var(--violet),var(--pink)); cursor:pointer; }
  .submit-btn:disabled{ opacity:.5; }

  /* Floating "I'M GASSED" sign-up shortcut — fixed to the bottom-center of the
     viewport so it stays reachable through any amount of scrolling. Tapping it
     smooth-scrolls down to the sign-up card. Same violet-bright -> pink gradient
     as .submit-btn above (and follows the active theme's CSS custom properties
     automatically), since it's just a shortcut into that same form. Hidden once
     the guest has actually signed up — see hideFloatingGassedBtn(). */
  .floating-gassed-btn{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:900;
    width:104px; height:104px; border-radius:50%; border:none; cursor:pointer;
    background:linear-gradient(135deg, var(--violet-bright), var(--pink));
    color:#170318; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:4px;
    box-shadow:0 8px 26px rgba(0,0,0,0.5);
    transition:transform .15s ease, opacity .2s ease;
  }
  .floating-gassed-btn:active{ transform:translateX(-50%) scale(0.92); }
  .floating-gassed-btn .fg-im{
    font-family:'Inter',-apple-system,sans-serif; font-size:10px; font-weight:700;
    letter-spacing:0.12em; text-transform:uppercase; opacity:0.82; margin-bottom:-1px;
  }
  .floating-gassed-btn .fg-gassed{
    font-family:'Inter',-apple-system,sans-serif; font-size:17px; font-weight:900; text-transform:uppercase;
  }
  @media (max-width:380px){
    .floating-gassed-btn{ width:92px; height:92px; }
    .floating-gassed-btn .fg-gassed{ font-size:14px; }
    .floating-gassed-btn .fg-im{ font-size:9px; }
  }

  .confirm{ display:none; text-align:center; padding:28px 16px; }
  .confirm.show{ display:block; }
  .check-circle{ width:56px;height:56px; margin:0 auto; border-radius:50%; background:linear-gradient(135deg,var(--violet),var(--pink)); display:flex;align-items:center;justify-content:center; font-size:26px; }
  .confirm h3{ margin:14px 0 6px; font-size:20px; }
  .confirm p{ color:var(--muted); font-size:13.5px; margin:0; }

  /* Comments — visible to everyone, posting gated to guests who signed up
     for this event (enforced by DB row-level security, see comments-setup.sql).
     Composer stays locked with an explanatory note until the guest has
     signed up (either just now, or on a prior visit from this browser). */
  .comments-wrap{ background:var(--card); border:1px solid rgba(255,255,255,0.06); border-radius:14px; padding:16px; }
  .comment-item{ padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.06); }
  .comment-item:last-child{ border-bottom:none; }
  .comment-top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:3px; }
  .comment-name{ font-weight:700; font-size:13.5px; color:var(--violet-bright); }
  .comment-time{ font-size:11px; color:var(--muted); }
  .comment-text{ font-size:14px; line-height:1.5; color:var(--text); }
  .comments-empty{ font-size:13px; color:var(--muted); padding:6px 0 14px; }
  .comment-composer{ display:flex; gap:8px; margin-top:14px; }
  .comment-composer input{ flex:1; padding:11px 13px; border-radius:10px; border:1px solid rgba(255,255,255,0.12); background:#0f0919; color:var(--text); font-size:14px; }
  .comment-composer input:focus{ outline:none; border-color:var(--violet-bright); }
  .comment-composer button{ padding:0 18px; border:none; border-radius:10px; font-weight:800; font-size:13px; color:#fff; background:linear-gradient(90deg,var(--violet),var(--pink)); cursor:pointer; }
  .comment-composer button:disabled{ opacity:.5; cursor:default; }
  .comment-locked-note{ margin-top:14px; font-size:12.5px; color:var(--muted); text-align:center; padding:10px; border:1px dashed rgba(255,255,255,0.15); border-radius:10px; }

  /* Photo/video gallery — "The Scene". Viewing is open to everyone; uploading
     and downloading are gated to guests who signed up for this event (see
     gallery-setup.sql). Downloaded images get a "GASSED" watermark stamped
     on client-side via canvas at download time — see downloadMediaItem(). */
  .gallery-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .gallery-item{ position:relative; border-radius:12px; overflow:hidden; aspect-ratio:1; background:#0f0919; border:1px solid rgba(255,255,255,0.08); }
  .gallery-item img, .gallery-item video{ width:100%; height:100%; object-fit:cover; display:block; }
  .gallery-item-dl{
    position:absolute; bottom:6px; right:6px; width:30px; height:30px; border-radius:50%;
    background:rgba(10,6,18,0.72); border:1px solid rgba(255,255,255,0.2); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:14px; cursor:pointer;
  }
  .gallery-empty{ font-size:13px; color:var(--muted); padding:6px 0 14px; grid-column:1 / -1; }
  .gallery-upload-row{ margin-top:14px; }
  .gallery-upload-btn{
    width:100%; padding:12px; border:1px dashed rgba(255,255,255,0.2); border-radius:10px;
    background:none; color:var(--violet-bright); font-weight:700; font-size:13px; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .gallery-upload-btn:disabled{ opacity:.5; }
  .gallery-pending-note{ font-size:11.5px; color:var(--muted); text-align:center; margin-top:8px; }

  .footer-note{ text-align:center; font-size:11px; color:#5f5478; margin-top:26px; padding:0 30px; line-height:1.6; }
  .loading, .not-found{ text-align:center; padding:80px 30px; color:var(--muted); font-size:14px; line-height:1.6; }
</style>
</head>
<body>
<div class="phone" id="pageRoot">
  <div class="loading" id="loadingState">Loading event…</div>
</div>

<button class="floating-gassed-btn" id="floatingGassedBtn" onclick="scrollToGassedSignup()" aria-label="I'm gassed — jump to sign up" style="display:none;"><span class="fg-im">I'M</span><span class="fg-gassed">GASSED</span></button>

<script src="/js/gassed-supabase.js"></script>
<script>
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

// Known theme keys — anything else (including missing/null, e.g. if the
// `theme` column doesn't exist yet on this Supabase project) falls back to
// the default violet look defined in :root, no error thrown either way.
const GASSED_KNOWN_THEMES = ['violet', 'amber', 'neon', 'redroom'];
function applyTheme(theme){
  if(theme && GASSED_KNOWN_THEMES.includes(theme) && theme !== 'violet'){
    document.documentElement.setAttribute('data-theme', theme);
  } else {
    document.documentElement.removeAttribute('data-theme');
  }
}

// ---- Comments (real, DB-backed) ----
// Viewing is open to everyone; posting is gated at the database level to
// guests who signed up for THIS event (see comments-setup.sql). We track
// two bits of local state once an event loads:
//   gassedCanComment — true once we know this browser's guest is allowed
//                      to post (either they just signed up, or a prior
//                      anonymous session on this device already has a
//                      matching signups row for this event).
//   gassedGuestName  — the name to attach to a posted comment.
let gassedCanComment = false;
let gassedGuestName = '';

function timeAgo(iso){
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.round(diffMs / 60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return mins + 'm ago';
  const hrs = Math.round(mins / 60);
  if(hrs < 24) return hrs + 'h ago';
  return Math.round(hrs / 24) + 'd ago';
}

async function loadComments(eventId){
  const listEl = document.getElementById('commentsList');
  if(!listEl) return;
  const { data: comments, error } = await gassedDb
    .from('comments')
    .select('*')
    .eq('event_id', eventId)
    .order('created_at', { ascending: true });

  // The comments table may not exist yet on every Supabase project this runs
  // against (it's a new addition — see comments-setup.sql) — fail quietly
  // rather than breaking the rest of the guest page.
  if(error){
    listEl.innerHTML = '<div class="comments-empty">Comments aren\'t open yet — check back soon.</div>';
    return;
  }

  listEl.innerHTML = comments.length
    ? comments.map(c => `
        <div class="comment-item">
          <div class="comment-top"><span class="comment-name">${escapeHtml(c.name)}</span><span class="comment-time">${timeAgo(c.created_at)}</span></div>
          <div class="comment-text">${escapeHtml(c.message)}</div>
        </div>
      `).join('')
    : '<div class="comments-empty">No comments yet — be the first to say something.</div>';
}

function renderCommentsComposer(eventId){
  const slot = document.getElementById('commentsComposerSlot');
  if(!slot) return;
  if(!gassedCanComment){
    slot.innerHTML = '<div class="comment-locked-note">Sign up above to join the chat.</div>';
    return;
  }
  slot.innerHTML = `
    <div class="comment-composer">
      <input type="text" id="commentInput" placeholder="Say something…" maxlength="280">
      <button id="commentPostBtn">Post</button>
    </div>
  `;
  const input = document.getElementById('commentInput');
  const btn = document.getElementById('commentPostBtn');
  const post = async () => {
    const message = input.value.trim();
    if(!message) { input.focus(); return; }
    btn.disabled = true;
    const { data: { session } } = await gassedDb.auth.getSession();
    if(!session){
      slot.innerHTML = '<div class="comment-locked-note">Sign up above to join the chat.</div>';
      return;
    }
    const { error } = await gassedDb.from('comments').insert({
      event_id: eventId, user_id: session.user.id, name: gassedGuestName, message
    });
    btn.disabled = false;
    if(error){
      alert("Couldn't post that: " + error.message);
      return;
    }
    input.value = '';
    loadComments(eventId);
  };
  btn.addEventListener('click', post);
  input.addEventListener('keydown', (e) => { if(e.key === 'Enter') post(); });
}

// A returning guest's browser may already hold an anonymous auth session
// from a prior sign-up (Supabase persists it in localStorage). If so, and
// that session's user has a signups row for this event, unlock commenting
// right away instead of making them sign up again.
async function checkCanCommentFromPriorSession(eventId){
  const { data: { session } } = await gassedDb.auth.getSession();
  if(!session) return;
  const { data: existingSignup } = await gassedDb
    .from('signups')
    .select('name')
    .eq('event_id', eventId)
    .eq('user_id', session.user.id)
    .maybeSingle();
  if(existingSignup){
    gassedCanComment = true;
    gassedGuestName = existingSignup.name;
    gassedGuestUserId = session.user.id;
  }
}

// ---- Photo/video gallery ("The Scene") ----
// Same gating shape as comments: viewing is open to everyone (approved
// items only), uploading requires gassedCanComment (reused here — it's
// really "has this browser signed up for this event", not comment-specific),
// and gassedGuestUserId (set alongside gassedCanComment) is the auth.uid()
// attached to any upload. See gallery-setup.sql for the RLS enforcing this
// at the database level.
let gassedGuestUserId = '';
const GASSED_MEDIA_BUCKET = 'event-media';

function gassedMediaPublicUrl(storagePath){
  return `${GASSED_SUPABASE_URL}/storage/v1/object/public/${GASSED_MEDIA_BUCKET}/${storagePath}`;
}

async function loadGallery(eventId){
  const grid = document.getElementById('galleryGrid');
  if(!grid) return;
  const { data: items, error } = await gassedDb
    .from('media')
    .select('*')
    .eq('event_id', eventId)
    .order('created_at', { ascending: false });

  // The media table/Storage bucket may not exist yet on every Supabase
  // project this runs against — fail quietly rather than breaking the rest
  // of the guest page.
  if(error){
    grid.innerHTML = '<div class="gallery-empty">The gallery isn\'t open yet — check back soon.</div>';
    return;
  }

  const visible = items.filter(m => m.approved || m.uploaded_by_user_id === gassedGuestUserId);
  if(!visible.length){
    grid.innerHTML = '<div class="gallery-empty">No photos yet — be the first to add one.</div>';
    return;
  }

  grid.innerHTML = visible.map(m => {
    const url = gassedMediaPublicUrl(m.storage_path);
    const pendingBadge = !m.approved ? '<div class="gallery-pending-note" style="position:absolute;top:6px;left:6px;background:rgba(10,6,18,0.72);padding:2px 7px;border-radius:6px;margin:0;">Pending review</div>' : '';
    const mediaHtml = m.media_type === 'video'
      ? `<video src="${url}" muted playsinline loop onmouseover="this.play()" onmouseout="this.pause()"></video>`
      : `<img src="${url}" alt="Event photo" loading="lazy">`;
    return `
      <div class="gallery-item" style="position:relative;">
        ${mediaHtml}
        ${pendingBadge}
        <div class="gallery-item-dl" title="Download" onclick="downloadMediaItem('${url}', '${m.media_type}')">⬇</div>
      </div>
    `;
  }).join('');
}

// Downloaded photos get a "GASSED" watermark stamped on via canvas, client
// side, at download time — this is the accepted v1 compromise (a lightweight
// deterrent, not launch-grade enforcement — see the concept doc). Video
// downloads skip the watermark (canvas can't easily stamp video) and just
// download the original file directly.
function downloadMediaItem(url, mediaType){
  if(mediaType === 'video'){
    const a = document.createElement('a');
    a.href = url;
    a.download = 'gassed-video';
    document.body.appendChild(a);
    a.click();
    a.remove();
    return;
  }
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const fontSize = Math.max(16, Math.round(canvas.width * 0.035));
    ctx.font = `800 ${fontSize}px Inter, sans-serif`;
    ctx.textBaseline = 'bottom';
    const label = 'GASSED';
    const pad = fontSize * 0.6;
    const textWidth = ctx.measureText(label).width;
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(canvas.width - textWidth - pad * 2, canvas.height - fontSize - pad * 1.4, textWidth + pad * 2, fontSize + pad * 1.4);
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.fillText(label, canvas.width - textWidth - pad, canvas.height - pad * 0.5);
    canvas.toBlob((blob) => {
      const dlUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = dlUrl;
      a.download = 'gassed-photo.jpg';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(dlUrl);
    }, 'image/jpeg', 0.92);
  };
  img.onerror = () => {
    // CORS or load failure — fall back to a plain, unwatermarked download
    // rather than leaving the tap doing nothing.
    const a = document.createElement('a');
    a.href = url;
    a.download = 'gassed-photo';
    document.body.appendChild(a);
    a.click();
    a.remove();
  };
  img.src = url;
}

function renderGalleryUploadSlot(eventId){
  const slot = document.getElementById('galleryUploadSlot');
  if(!slot) return;
  if(!gassedCanComment){
    slot.innerHTML = '<div class="comment-locked-note">Sign up above to add your own photos.</div>';
    return;
  }
  slot.innerHTML = `
    <input type="file" id="mediaFileInput" accept="image/*,video/*" style="display:none;">
    <button class="gallery-upload-btn" id="mediaUploadBtn">+ Add a photo or video</button>
  `;
  document.getElementById('mediaUploadBtn').addEventListener('click', () => {
    document.getElementById('mediaFileInput').click();
  });
  document.getElementById('mediaFileInput').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const btn = document.getElementById('mediaUploadBtn');
    btn.disabled = true;
    btn.textContent = 'Uploading…';

    const mediaType = file.type.startsWith('video') ? 'video' : 'image';
    const ext = (file.name.split('.').pop() || (mediaType === 'video' ? 'mp4' : 'jpg')).toLowerCase();
    const path = `${eventId}/${gassedGuestUserId}-${Date.now()}.${ext}`;

    const { error: uploadErr } = await gassedDb.storage.from(GASSED_MEDIA_BUCKET).upload(path, file);
    if(uploadErr){
      alert("Couldn't upload that: " + uploadErr.message);
      btn.disabled = false;
      btn.textContent = '+ Add a photo or video';
      return;
    }

    const { error: insertErr } = await gassedDb.from('media').insert({
      event_id: eventId, uploaded_by_user_id: gassedGuestUserId, storage_path: path, media_type: mediaType
    });
    btn.disabled = false;
    btn.textContent = '+ Add a photo or video';
    if(insertErr){
      alert("Couldn't save that: " + insertErr.message);
      return;
    }
    document.getElementById('mediaFileInput').value = '';
    loadGallery(eventId);
  });
}

async function loadEvent(){
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('event');
  const root = document.getElementById('pageRoot');

  if(!slug){
    root.innerHTML = '<div class="not-found">No event specified.</div>';
    return;
  }

  // Try to pull the promoter's avatar_url too (used for the host identity block).
  // That column may not exist yet on every Supabase project this runs against,
  // so if the wider select errors out, fall back to the known-good column set
  // rather than breaking the whole guest page.
  let { data: event, error } = await gassedDb
    .from('events')
    .select('*, promoters(handle, display_name, tagline, avatar_url)')
    .eq('slug', slug)
    .eq('status', 'live')
    .single();

  if(error){
    const fallback = await gassedDb
      .from('events')
      .select('*, promoters(handle, display_name, tagline)')
      .eq('slug', slug)
      .eq('status', 'live')
      .single();
    event = fallback.data;
    error = fallback.error;
  }

  if(error || !event){
    root.innerHTML = '<div class="not-found">This event doesn\'t exist or isn\'t live yet.</div>';
    return;
  }

  const { data: lineupItems } = await gassedDb
    .from('lineup_items')
    .select('*')
    .eq('event_id', event.id)
    .order('sort_order', { ascending: true });

  const { count: signupCount } = await gassedDb
    .from('signups')
    .select('*', { count: 'exact', head: true })
    .eq('event_id', event.id);

  applyTheme(event.theme);
  await checkCanCommentFromPriorSession(event.id);
  renderPage(event, lineupItems || [], signupCount || 0);
}

// Called from both checkCanCommentFromPriorSession (returning guests) and
// the sign-up submit handler (new guests) — keeps gassedGuestUserId in sync
// with gassedCanComment so the gallery's upload gate always knows who's
// uploading.

// ---- Floating "I'M GASSED" sign-up shortcut ----
function scrollToGassedSignup(){
  const el = document.getElementById('formCard');
  if(el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
function hideFloatingGassedBtn(){
  const b = document.getElementById('floatingGassedBtn');
  if(b){ b.style.display = 'none'; b.dataset.signedUp = '1'; }
}
function showFloatingGassedBtn(){
  const b = document.getElementById('floatingGassedBtn');
  if(b) b.style.display = 'flex';
  watchFormCardVisibility();
}
// On short pages (or once scrolled down), the sign-up form is already on
// screen — showing the floating shortcut on top of it just blocks the
// "Your name" field instead of helping. Hide the button whenever the form
// card itself is visible, and bring it back once the guest scrolls away
// from it. Skipped entirely once the guest has actually signed up (see
// hideFloatingGassedBtn's dataset.signedUp flag), since the button should
// stay hidden for good at that point.
function watchFormCardVisibility(){
  const formCard = document.getElementById('formCard');
  const btn = document.getElementById('floatingGassedBtn');
  if(!formCard || !btn || !('IntersectionObserver' in window)) return;
  const observer = new IntersectionObserver((entries)=>{
    if(btn.dataset.signedUp === '1') { observer.disconnect(); return; }
    const entry = entries[0];
    btn.style.display = entry.isIntersecting ? 'none' : 'flex';
  }, { threshold: 0.2 });
  observer.observe(formCard);
}

function renderPage(event, lineupItems, signupCount){
  const root = document.getElementById('pageRoot');
  const promoter = event.promoters || {};
  const promoterHandle = promoter.handle || 'plug';
  const hostName = promoter.display_name || ('@' + promoterHandle);
  const hostInitial = (hostName || '?').replace('@','').trim().charAt(0).toUpperCase() || 'G';
  const hostAvatarHtml = promoter.avatar_url
    ? `<img src="${escapeHtml(promoter.avatar_url)}" alt="${escapeHtml(hostName)}">`
    : hostInitial;
  const hostTaglineHtml = promoter.tagline
    ? `<div class="host-spot-tagline">${escapeHtml(promoter.tagline)}</div>`
    : '';
  const dateStr = new Date(event.event_at).toLocaleString('en-US', { weekday:'long', month:'long', day:'numeric' });
  const timeStr = new Date(event.event_at).toLocaleString('en-US', { hour:'numeric', minute:'2-digit' });
  const pct = Math.min(signupCount / (event.gauge_target || 1), 1) * 100;

  const lineupHtml = lineupItems.length ? `
    <div class="section">
      <div class="section-label">The Lineup</div>
      ${lineupItems.map(li => `
        <div class="lineup-item">
          <div class="li-top"><span class="li-name">${escapeHtml(li.name)}</span><span class="li-price">${escapeHtml(li.price_label)}</span></div>
          <div class="li-desc">${escapeHtml(li.description)}</div>
        </div>
      `).join('')}
    </div>
  ` : '';

  const hypeHtml = event.hype_hook ? `<div class="hype-banner">${escapeHtml(event.hype_hook)}</div>` : '';

  // Sign-up mode — 'full' asks for phone (required) + Instagram (optional) in
  // addition to name; anything else (including missing/null, e.g. if the
  // `signup_mode` column doesn't exist yet on this Supabase project) falls
  // back to today's name-only behavior, no error thrown either way.
  const signupMode = event.signup_mode === 'full' ? 'full' : 'trial';
  const extraFieldsHtml = signupMode === 'full' ? `
        <div class="field">
          <label>Phone number</label>
          <input type="tel" id="phoneInput" placeholder="For the door list">
        </div>
        <div class="field">
          <label>Instagram (optional)</label>
          <input type="text" id="igInput" placeholder="@yourhandle">
        </div>
  ` : '';

  root.innerHTML = `
    <div class="hero">
      <div class="brand">powered by <span>gassed</span></div>
      <div class="club-name">${escapeHtml(event.venue_name).toUpperCase()}</div>
      <div class="meta">${escapeHtml(event.venue_address)}${event.venue_address ? ' · ' : ''}${dateStr}<br>Doors ${timeStr}</div>
      <div class="host-row"><span class="host-dot"></span> Plugged by @${escapeHtml(promoterHandle)}</div>
    </div>

    <div class="section">
      <div class="host-spot-card">
        <div class="host-spot-top">
          <div class="host-spot-avatar">${hostAvatarHtml}</div>
          <div class="host-spot-info">
            <div class="host-spot-label">Your Plug</div>
            <div class="host-spot-name">${escapeHtml(hostName)}</div>
            ${hostTaglineHtml}
          </div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="entry-card"><b>${escapeHtml(event.entry_info || 'Details coming soon')}</b></div>
      ${hypeHtml}
    </div>

    <div class="section">
      <div class="gauge-wrap">
        <div class="gauge-top"><span>Spots filling up</span><b>${signupCount} / ${event.gauge_target} gassed up</b></div>
        <div class="tank-wrap"><div class="tank-fill" id="gaugeFill" style="width:0%"></div></div>
      </div>
    </div>

    ${lineupHtml}

    <div class="section">
      <div class="section-label">You in?</div>
      <div class="form-card" id="formCard">
        <div class="field">
          <label>Your name</label>
          <input type="text" id="nameInput" placeholder="First & last name">
        </div>
        ${extraFieldsHtml}
        <button class="submit-btn" id="submitBtn">I'm gassed — I'm coming</button>
      </div>
      <div class="confirm" id="confirmCard">
        <div class="check-circle">✓</div>
        <h3>You're gassed up</h3>
        <p>You're on the list for ${escapeHtml(event.venue_name)}, ${dateStr}.<br>See you at the door.</p>
      </div>
    </div>

    <div class="section">
      <div class="section-label">The Scene</div>
      <div class="comments-wrap">
        <div class="gallery-grid" id="galleryGrid"><div class="gallery-empty">Loading photos…</div></div>
        <div class="gallery-upload-row" id="galleryUploadSlot"></div>
      </div>
    </div>

    <div class="section">
      <div class="section-label">The Chat</div>
      <div class="comments-wrap">
        <div id="commentsList"><div class="comments-empty">Loading comments…</div></div>
        <div id="commentsComposerSlot"></div>
      </div>
    </div>

    <div class="footer-note">Powered by Gassed — a link-in-bio built for throwing a night out.</div>
  `;

  requestAnimationFrame(() => {
    document.getElementById('gaugeFill').style.width = pct + '%';
  });

  document.getElementById('submitBtn').addEventListener('click', async () => {
    const name = document.getElementById('nameInput').value.trim();
    if(!name){
      document.getElementById('nameInput').focus();
      return;
    }
    const phoneEl = document.getElementById('phoneInput');
    const igEl = document.getElementById('igInput');
    const phone = phoneEl ? phoneEl.value.trim() : '';
    const instagram = igEl ? igEl.value.trim() : '';
    if(signupMode === 'full' && !phone){
      phoneEl.focus();
      return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Signing up…';

    const signupFields = { event_id: event.id, name };
    if(signupMode === 'full'){
      signupFields.phone = phone;
      if(instagram) signupFields.instagram = instagram;
    }

    // Give this browser a real (anonymous) auth user so the comments feature
    // can later verify "did this visitor actually sign up for this event"
    // at the database level. If anonymous sign-ins aren't enabled yet on this
    // Supabase project, this just fails quietly and sign-up proceeds without
    // a user_id — commenting simply stays locked for that guest until it's
    // turned on (Auth -> Providers -> Anonymous, in Supabase settings).
    let session = (await gassedDb.auth.getSession()).data.session;
    if(!session){
      const { data: authData } = await gassedDb.auth.signInAnonymously();
      session = authData ? authData.session : null;
    }
    if(session) signupFields.user_id = session.user.id;

    // phone/instagram/user_id may not exist as columns yet on every Supabase
    // project this runs against — try the full insert first, and fall back
    // to the known-good name-only insert rather than failing the whole
    // sign-up if they're missing. Same defensive pattern as theme/avatar_url
    // elsewhere.
    let { error } = await gassedDb.from('signups').insert(signupFields);
    if(error && (signupMode === 'full' || signupFields.user_id)){
      const fallback = await gassedDb.from('signups').insert({ event_id: event.id, name });
      error = fallback.error;
    }

    if(error){
      alert("Couldn't sign up: " + error.message);
      btn.disabled = false;
      btn.textContent = "I'm gassed — I'm coming";
      return;
    }

    document.getElementById('formCard').style.display = 'none';
    document.getElementById('confirmCard').classList.add('show');
    hideFloatingGassedBtn();

    if(session){
      gassedCanComment = true;
      gassedGuestName = name;
      gassedGuestUserId = session.user.id;
      renderCommentsComposer(event.id);
      renderGalleryUploadSlot(event.id);
    }
  });

  showFloatingGassedBtn();
  loadComments(event.id);
  renderCommentsComposer(event.id);
  loadGallery(event.id);
  renderGalleryUploadSlot(event.id);
}

loadEvent();
</script>
